name: Deploy to All-Inkl

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      # Nur Vite-Build — `npm run build` (tsc) schlägt in CI wegen *.test.ts fehl.
      - run: npx vite build

      - name: Upload dist via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          # Inkrementell: unveränderte Vite-Assets (Fonts, gehashte Chunks) bleiben —
          # schneller und weniger FTPS-Timeouts. FTP-User darf nur das App-Verzeichnis sehen.
          # Alte, nicht mehr gebaute Chunks können liegen bleiben → ggf. gelegentlich manuell
          # aufräumen oder vorübergehend auf true setzen.
          dangerous-clean-slate: false
